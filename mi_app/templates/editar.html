<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/Funciones.js') }}" defer></script>
    <title>Document</title>
</head>
<body>

<div  class="contenedor-formularios">
    <div class="form-group rounded-top border-success rounded-top">
    <h1>editar</h1>
    <form method="POST" action="{{ url_for('actualizar_producto', producto_id=producto['CODIGO'])}}">

        <label for="">nombre:</label><br>
        <input type="text" name="NOMBRE" id="NOMBRE"  value="{{producto['NOMBRE']}}" required> <br><br>

        <label for="">Precio:</label><br>
        <input type="text" name="PRECIO" id="PRECIO" step="0.01" value="{{producto['PRECIO']}}" required> <br><br>

            <button type="submit">Guardar</button>
            <button>
                <a href="{{ url_for('mostrador') }}">cancelar</a>
            </button>
    </div>
        <div>
            <img class="editar-img" src="{{ url_for('static', filename='img/productos/' + producto['CODIGO']|string + '.jpg') }}" class="card-img-top" alt="...">
        </div>


        
    </form>
</div>
</body>
</html>
