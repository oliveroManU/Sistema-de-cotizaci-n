<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/FuncionesInsert.js') }}" defer></script>
    <title>Document</title>
</head>
<body>
<header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Velazcres</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{{ url_for('listado') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('cotizacion_int') }}">Registro</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('mostrador') }}">Productos</a>
        </li>
      </ul>
      <span class="navbar-text">
        Eslogan
      </span>
    </div>
  </div>
</nav>
</header>

<div class="contenedor-formularios" style="width: 97%;">
  <div  class="rounded-top  rounded-top" >

    <h1 class="h1-insert" >Registro de producto</h1>

    <form  action="{{ url_for('cotizacion_int') }}" method="POST" >
       

        <table  class="table table-striped table-bordered bg-white table-sm" style="margin-left: 0%;">
            <thead class="thead-dark">
                <tr>
                    <th>Producto</th>
                    <th>Marca</th>
                    <th>Moneda</th>
                    <th>Gastado</th>
                    <th>Cantidad</th>
                    <th>Precio por unidad</th>
                    <th>Tasapago</th>
                    <th>Conversion</th>
                    <th>Precio de venta</th>
                    <th>Total</th>
                    
                </tr>
            </thead>
            <tbody style="height: 200px;" >
                <tr>
                    <td><input class="form-control" type="text" name="nombre"></td>
                    <td><input class="form-control" type="text" name="marca"></td>
                    <td><input class="form-control input-corto-insersion" style="width: 55px;" type="text" name="moneda" value="Bs." readonly></td>
                    <td><input class="form-control precio-producto" type="number" oninput="multiplicacion(this)" name="precio-producto"></td>
                    <td><input class="form-control input-corto-insersion cantidad-producto" style="width: 55px;" type="number" min="1" value="1" oninput="multiplicacion(this)" name="cantidad-producto" ></td>
                    <td><input class="form-control precioporunidad" type="text" name="precioporunidad" readonly></td>
                    <td><input class="form-control tasapago" type="text" name="tasapago" value="{{ '%.2f'|format(tasa_bcv) if tasa_bcv else '' }}" oninput="multiplicacion(this)" readonly></td>      
                    <td><div class="input-group mb-3">
                        <div class="input-group-prepend">
                        <span class="input-group-text">BCV</span>        
                        </div>
                        <input class="form-control preciod " type="text" name="preciod" oninput="multiplicacion(this)"></div></td>
                    <td><div class="input-group mb-3">
                        <div class="input-group-prepend">
                        <span class="input-group-text">BCV</span></div>
                        <input class="form-control precio-venta " type="text" name="precio-venta" oninput="multiplicacion(this)"></div></td>    
                    
                    <td><div class="input-group mb-3">
                        <div class="input-group-prepend">
                        <span class="input-group-text">BCV</span>        
                        </div><input class="form-control preciod gananciaD " type="text" name="gananciaD" oninput="multiplicacion(this)" readonly> </div> 
                        <div class="input-group mb-3">
                        <div class="input-group-prepend">
                        <span class="input-group-text">BCV</span>        
                        </div><input class="form-control precio-venta gananciaBs " type="text" name="gananciaBs" oninput="multiplicacion(this)" readonly></div></td>                       
                    
                      
                      
                      
                </tr>
            </tbody>
            
 
    
        </table>
        <button style="margin-top: 15px;" class="btn btn-primary" type="submit"> Realizar</button>
    </form>
  </div>

  


</div>




</body>
</html>
